name: Build NetworkGuardian

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # This repo's committed gradlew relies on a wrapper jar that isn't tracked in the
      # generated project. gradle/actions/setup-gradle provisions Gradle 8.7 directly, so
      # every step below invokes `gradle` rather than `./gradlew`. If you regenerate the
      # wrapper locally (`gradle wrapper`) and commit gradle/wrapper/gradle-wrapper.jar,
      # you can switch these to `./gradlew` instead.
      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: networkguardian-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-build:
    runs-on: ubuntu-latest
    needs: build
    if: false # Disabled by default — enable and add signing secrets to produce a release APK.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: networkguardian-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
